[package]
name = "uedctl-native"
version = "0.1.0"
edition = "2021"
description = "Native CSG/BSP + lighting compute core for uedctl's editor-free level materialize"
license = "MIT"

[lib]
name = "uedctl_native"
# cdylib -> the Python extension module; rlib -> `cargo test` can link the pure-Rust core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is NOT enabled here: `cargo test` links libpython (so the pure-core
# unit tests build), while `maturin develop` enables it via the feature below so the shipped
# `.so` doesn't link libpython (the correct extension-module behaviour).  See spec §8.2-3.
pyo3 = { version = "0.22", features = ["abi3-py312"] }
rayon = "1"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
