[package]
name = "resolve-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
resolve-core = { path = "../resolve-core" }
serde_json = "1"           # this crate's own resolveClass wraps resolve_core's ClassResolution
                            # in serde_json::to_string -- does not compile without this.
wasm-bindgen = "=0.2.100"  # EXACT pin (== not ^) -- must match dev-container/Dockerfile's
                            # wasm-bindgen-cli version byte-for-byte; the CLI and the crate
                            # version drifting apart is a real, silent build-breaking failure
                            # mode for wasm-bindgen. IMPORTANT: `dev-container/Dockerfile` installs
                            # Rust via `--default-toolchain stable` (floating, unpinned) --
                            # wasm-bindgen releases before ~0.2.95 are known-incompatible with the
                            # wasm32-unknown-unknown codegen changes landed in Rust 1.82+, which a
                            # floating `stable` will already be past. 0.2.100 is chosen as a
                            # recent release clear of that break, but Step 3's REAL Docker build is
                            # still the actual gate -- if it fails with a parse/schema-mismatch
                            # error, bump this (crate AND CLI together) to whatever version is
                            # verified compatible with `rustc --version` inside the image at build
                            # time, rather than trusting this number in isolation.
