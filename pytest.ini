[pytest]
# Only the uedctl package is the test suite. Without this, a bare `pytest` (or
# `pytest -k …` with no path) walks the WHOLE Tools/uedctl tree — the baked editor,
# asset dirs, and stray spike `test_*.py` under docs/ (which import machine-specific
# paths) — which is slow-to-hangs. An explicit path arg still overrides testpaths.
testpaths = uedctl
markers =
    integration: requires the live dx-lum-uned container (deselected unless -m integration)
    real_validation: opt OUT of the autouse author-validation stub to exercise the real ingest gate
    real_mover_index: opt OUT of the autouse mover class-index stub to exercise the real resolver seam
addopts = -m "not integration"
